name: JobRadar

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch: {}

concurrency:
  group: jobradar-cycle
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  buscar-vagas:
    runs-on: ubuntu-latest
    # Sem isso, o padrão do GitHub Actions é 6h (360min) — uma fonte travada
    # (ex: Catho com timeout de anti-bot, ou LinkedIn rate-limitado)
    # consumiria até 6h de cada vez. Com concurrency.cancel-in-progress:
    # false, um run travado também bloqueia o próximo ciclo inteiro, porque
    # o run seguinte fica na fila esperando o anterior liberar o grupo. 150
    # min dá folga real sobre a duração medida do ciclo (~1h30-2h com toda a
    # paginação e a passada dupla do LinkedIn) e ainda fica abaixo do
    # intervalo do cron (3h), então um run truncado nunca empilha em cima
    # do próximo agendado.
    #
    # Rodam aqui os três perfis de pessoas reais deste fork (dev, admin e
    # agro). brasil e internacional (Dados/BI, da autora original)
    # continuam no código e rodáveis por linha de comando, mas ficam fora
    # do cron: cada perfil a mais é tempo de ciclo somado sem retorno.
    #
    # MEDIDO: dev + admin juntos levaram 8min47 (run de 25/08 10:07). O
    # perfil agro tem o mesmo formato de custo do admin (12 termos por
    # ciclo, portais generalistas), com uma cidade a mais no LinkedIn — 3
    # em vez de 1, ver LOCATIONS_LINKEDIN_CIDADES_AGRO. Estimativa de
    # ciclo com os três: 15-20 min, bem dentro dos 150.
    #
    # Os três são baratos perto do perfil brasil, contra o qual este
    # número foi calibrado: ele roda 15 termos e 16 buscas de LinkedIn por
    # termo (1 país x 2 passadas + 6 países só-remoto + 8 cidades).
    timeout-minutes: 150
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Rodar JobRadar (um ciclo de cada perfil)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        # Um projeto só, com perfis selecionáveis (ver core/perfis.py).
        # Aqui rodam os três perfis de pessoas reais deste fork: `dev`
        # (back-end Node/TypeScript), `admin` (administrativo/financeiro/
        # RH) e `agro` (agronomia, SC e PR). Os três notificam no MESMO
        # chat do Telegram, distinguidos pela linha "Perfil:" da
        # notificação (ver notificar_vaga).
        #
        # brasil e internacional são os perfis de Dados/BI da autora
        # original: continuam existindo e rodáveis à mão
        # (`python main.py --perfil brasil --once`), mas fora do cron.
        run: python main.py --perfil dev admin agro --once

      - name: Salvar vagas já vistas (evita notificação duplicada)
        run: |
          git config user.name "jobradar-bot"
          git config user.email "jobradar-bot@users.noreply.github.com"

          # O banco produzido por ESTA execução, guardado fora da árvore do
          # repositório. É a única coisa deste run que sobrevive ao passo
          # abaixo — todo o resto é descartado e retomado do GitHub.
          if [ ! -f data/jobs.db ]; then
            echo "data/jobs.db não existe ao fim do ciclo — nada a salvar."
            exit 1
          fi
          cp data/jobs.db "${RUNNER_TEMP:-/tmp}/jobs.db"

          # MEDIDO (18/08): este passo usava
          #
          #     git rebase origin/main -X theirs
          #
          # pra reenviar quando o push era recusado. Na madrugada de 18/08 o
          # histórico do repositório foi reescrito enquanto uma execução
          # estava no ar (ela começou 21h e terminou 23h12). Ao ser recusada,
          # ela caiu nesse rebase e REAPLICOU commits antigos por cima do
          # estado novo, com "-X theirs" resolvendo a favor da versão do run.
          # Resultado: main.py e core/config.py voltaram atrás e duas
          # correções foram desfeitas em produção — descoberto só quando a
          # usuária relatou que uma notificação parou de chegar.
          #
          # Prova de autoria do commit que reverteu (75de7b6): autor
          # "liliam" (autoria original preservada no replay) mas committer
          # "jobradar-bot", no mesmo segundo do commit deste passo.
          #
          # O robô não tem motivo NENHUM pra escrever arquivo de código. Em
          # vez de reaplicar commits em cima do estado remoto, ele agora
          # ADOTA o estado remoto inteiro e recoloca só o banco por cima.
          # A diferença importa: reaplicar commit pode trazer junto qualquer
          # coisa que estava naquele commit; recolocar um arquivo só não
          # pode. Qualquer commit gerado aqui contém data/jobs.db e mais
          # nada — verificado em simulação com divergência máxima (duas
          # correções de código + reescrita de histórico ao mesmo tempo).
          #
          # Efeito colateral bom: se alguém enviar correção de código no meio
          # de um ciclo, o robô passa a INCORPORAR essa correção em vez de
          # disputar com ela.
          n=0
          while :; do
            git fetch origin main
            git reset --hard origin/main

            cp "${RUNNER_TEMP:-/tmp}/jobs.db" data/jobs.db

            # A página pública (GitHub Pages) é REGENERADA a partir do
            # banco, não carregada do run anterior — por isso roda aqui
            # dentro do laço, depois do reset --hard: o HTML sempre reflete
            # exatamente o jobs.db que está sendo commitado junto, mesmo
            # quando o push é recusado e o laço repete contra um estado
            # remoto novo.
            #
            # Efeito conhecido: a página carimba a hora da geração, então
            # ela muda em TODO ciclo e o "nada novo pra commitar" abaixo
            # praticamente não dispara mais. É de propósito — o carimbo é
            # prova de vida do robô: página com hora de 3h atrás significa
            # que o ciclo rodou, mesmo num ciclo sem vaga nova nenhuma.
            python -m web.gerar

            git add data/jobs.db docs/index.html

            if git diff --cached --quiet; then
              echo "Nada novo pra commitar."
              exit 0
            fi

            git commit -m "chore: atualiza vagas vistas e página [skip ci]"

            if git push; then
              exit 0
            fi

            n=$((n + 1))
            if [ "$n" -ge 5 ]; then
              echo "Push falhou depois de 5 tentativas."
              exit 1
            fi
            echo "Push rejeitado, sincronizando (tentativa $n)..."
            sleep $((RANDOM % 5 + 1))
          done
